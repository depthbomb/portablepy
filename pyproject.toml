[build-system]
requires = ['setuptools>=77']
build-backend = 'setuptools.build_meta'

[project]
name = 'portablepy'
version = '0.1.0'
description = 'Build portable Python application bundles with verified offline wheels'
readme = 'README.md'
requires-python = '>=3.14'
license = 'MIT'
license-files = ['LICENSE']
dependencies = ['argly>=0.1,<1']
classifiers = [
    'Development Status :: 3 - Alpha',
    'Environment :: Console',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.14',
]

[project.scripts]
portablepy = 'portablepy.cli:main'

[project.optional-dependencies]
dev = ['build>=1.2', 'pytest>=8', 'ruff>=0.12', 'mypy>=1.18', 'twine>=6']

[tool.setuptools.packages.find]
where = ['src']

[tool.pytest.ini_options]
testpaths = ['tests']

[tool.ruff]
target-version = 'py314'
line-length = 100

[tool.ruff.lint]
select = ['E4', 'E7', 'E9', 'F', 'B']

[tool.ruff.format]
quote-style = 'single'

[tool.mypy]
python_version = '3.14'
files = ['src/portablepy']
check_untyped_defs = true
warn_unused_ignores = true
