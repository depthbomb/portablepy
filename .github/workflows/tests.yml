name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Create virtual environment
        run: python -m venv .venv
      - name: Select virtual environment
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$GITHUB_WORKSPACE/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          fi
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install the built wheel
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Test the installed wheel
        run: |
          test_dir=$(mktemp -d)
          cp -R tests "$test_dir/"
          cp pyproject.toml "$test_dir/"
          cd "$test_dir"
          python -m pytest --import-mode=importlib -q
          python -m pip check
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
