name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' && github.ref_type != 'tag' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Create virtual environment
        run: python -m venv .venv
      - name: Select virtual environment
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$GITHUB_WORKSPACE/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          fi
      - run: python -m pip install -e '.[dev]'
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          from os import environ
          from pathlib import Path
          from tomllib import loads
          from portablepy import __version__

          version = loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          if version != __version__:
              raise SystemExit('Package metadata and portablepy.__version__ differ')
          tag = environ.get('RELEASE_TAG', '')
          if tag and tag != f'v{version}':
              raise SystemExit(f'Release tag {tag!r} does not match version {version!r}')
          print(f'Checking portablepy {version}')
          PY
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install the built wheel
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Confirm imports come from the installed wheel
        run: |
          python -I - <<'PY'
          from sys import prefix
          from pathlib import Path
          from portablepy import __file__

          if not Path(__file__).resolve().is_relative_to(Path(prefix).resolve()):
              raise SystemExit(f'Imported checkout instead of installed wheel: {__file__}')
          print(__file__)
          PY
      - name: Test the installed wheel with coverage
        run: |
          test_dir=$(mktemp -d)
          cp -R tests "$test_dir/"
          cp pyproject.toml "$test_dir/"
          cd "$test_dir"
          python -m pytest --import-mode=importlib --cov=portablepy --cov-branch --cov-report=term-missing --cov-report="xml:$RUNNER_TEMP/coverage.xml"
          python -m portablepy --help
          portablepy --help
      - run: python -m pip check
      - name: Save validated distributions
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Save coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: ${{ runner.temp }}/coverage.xml
          if-no-files-found: error
          retention-days: 14
